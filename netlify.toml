[build]
  command   = "npm run build"
  publish   = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options        = "nosniff"
    X-Frame-Options               = "DENY"
    Referrer-Policy               = "strict-origin-when-cross-origin"
    Permissions-Policy            = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security     = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy       = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none';"

[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
